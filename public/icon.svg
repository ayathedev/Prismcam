<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glassReflect" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9"/>
    </radialGradient>
  </defs>

  <!-- Base Plate Background -->
  <rect width="512" height="512" rx="128" fill="#09090b"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#facc15" stroke-width="6" opacity="0.85"/>
  <circle cx="256" cy="256" r="176" fill="url(#lensGrad)" stroke="#27272a" stroke-width="8"/>
  
  <!-- Lens Glass Element -->
  <circle cx="256" cy="256" r="130" fill="url(#glassReflect)"/>
  
  <!-- Aperture Blades Accent -->
  <circle cx="256" cy="256" r="70" fill="#000000" stroke="#facc15" stroke-width="4"/>
  <circle cx="256" cy="256" r="28" fill="#facc15"/>
  
  <!-- Optical Light Reflection Flare -->
  <ellipse cx="215" cy="205" rx="36" ry="18" transform="rotate(-35 215 205)" fill="#ffffff" opacity="0.25"/>
  <circle cx="295" cy="285" r="8" fill="#38bdf8" opacity="0.6"/>
</svg>
